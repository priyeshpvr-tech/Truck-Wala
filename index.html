<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Truck Wala — the retro highway music experience.">
  <meta name="theme-color" content="#1a1a1a">
  <title>Truck Wala — The Retro Music Experience</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <header class="top-bar">
    <div id="clock">12:00 pm</div>
    <div class="window-controls">
      <button class="icon-btn" id="btn-playlist" type="button" title="Playlist" aria-label="Open playlist">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h11v2H3v-2zm0-4h11v2H3V6zm0 8h7v2H3v-2zm13-1v7l6-3.5-6-3.5z"/></svg>
      </button>
      <button class="icon-btn" id="btn-minimize" type="button" title="Minimize UI" aria-label="Minimize interface">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>
      <button class="icon-btn" id="btn-fullscreen" type="button" title="Full Screen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <h1 class="main-heading">Truck Wala</h1>

    <section class="player-container" id="player-container" aria-label="Truck Wala music player">
      <div class="poster-wrapper">
        <img src="" alt="Current song artwork" class="poster" id="poster">
      </div>

      <div class="info">
        <div class="title" id="songTitle">Song Title</div>
        <div class="artist" id="songArtist">Artist</div>
        <div class="progress-row">
          <div class="time"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></div>
          <input type="range" id="seekBar" min="0" max="100" value="0" aria-label="Song progress">
        </div>
      </div>

      <div class="controls">
        <button class="icon-btn player-control" id="btn-loop" type="button" title="Toggle loop" aria-label="Toggle loop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        </button>
        <button class="icon-btn player-control" id="btn-prev" type="button" title="Previous" aria-label="Previous song">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zm3.66 6.82l5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07a1 1 0 0 0 0 1.64z"/></svg>
        </button>
        <button class="icon-btn btn-play" id="btn-play" type="button" title="Play" aria-label="Play">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7V5zm6 0h4v14h-4V5z"/></svg>
        </button>
        <button class="icon-btn player-control" id="btn-next" type="button" title="Next" aria-label="Next song">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.58 16.89l5.77-4.07a1 1 0 0 0 0-1.64L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82zM16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
        </button>
      </div>

      <div class="volume-control">
        <button class="icon-btn" id="btn-mute" type="button" title="Mute" aria-label="Mute">
          <svg viewBox="0 0 24 24" id="volume-icon" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <input id="volumeBar" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </section>

    <div id="playerNotice" class="player-notice" hidden></div>

    <div id="youtube-player" aria-hidden="true"></div>

    <section class="playlist-overlay" id="playlist-overlay" aria-hidden="true">
      <div class="playlist-content" role="dialog" aria-modal="true" aria-labelledby="playlistHeading">
        <div class="playlist-header">
          <div>
            <span class="playlist-kicker">TRUCK WALA RADIO</span>
            <h2 id="playlistHeading">Up Next</h2>
            <p id="playlistSubheading">YouTube Playlist</p>
          </div>
          <div class="playlist-actions">
            <button class="small-action" id="btn-setup" type="button">Playlist setup</button>
            <button class="btn-close" id="btn-close-playlist" type="button" aria-label="Close playlist">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

        <form class="setup-panel" id="setupPanel" hidden onsubmit="return false;">
          <label><span>YOUTUBE PLAYLIST URL / ID</span><input id="playlistInput" type="text" placeholder="https://www.youtube.com/playlist?list=PL..." autocomplete="off"></label>
          <label><span>YOUTUBE DATA API KEY</span><input id="apiKeyInput" type="password" placeholder="AIza..." autocomplete="off"></label>
          <div class="setup-buttons">
            <button class="setup-primary" id="loadPlaylistButton" type="button">Load playlist</button>
            <button class="small-action" id="clearSettingsButton" type="button">Clear</button>
          </div>
          <p>For a static website, use a browser/referrer-restricted key and enable only YouTube Data API v3.</p>
        </form>

        <div class="playlist-search">
          <input type="text" id="songSearch" placeholder="Search songs..." autocomplete="off" aria-label="Search songs">
        </div>

        <div class="playlist-status"><span id="playlistStatus">SETUP REQUIRED</span><span id="songCount">0 songs</span></div>
        <div class="playlist-items" id="playlist-items"></div>
        <div class="playlist-empty" id="playlistEmpty">No playlist loaded.</div>
      </div>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/youtube-data.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
