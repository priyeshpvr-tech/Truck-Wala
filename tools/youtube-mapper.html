<style>
:root{--bg:#101010;--panel:#181715;--line:#2a2824;--text:#eee7d8;--muted:#817d73;--accent:#e5a62b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#272218,#101010 55%);color:var(--text);font:14px system-ui,sans-serif}
main{max-width:1050px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}
h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:6px 0 0}.stat{font:800 12px monospace;color:var(--accent)}
.toolbar{position:sticky;top:0;z-index:3;padding:12px 0;background:rgba(16,16,16,.92);backdrop-filter:blur(10px)}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#151412;color:var(--text);outline:0}
.progress{height:7px;background:#27251f;border-radius:9px;margin:10px 0 18px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.row{display:grid;grid-template-columns:42px minmax(220px,1fr) 280px 120px;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);background:rgba(24,23,21,.8);margin:6px 0;border-radius:9px}
.num{font:700 11px monospace;color:#746f65}.title{font-weight:800}.artist{font-size:11px;color:var(--muted);margin-top:3px}
.id{font-family:monospace;font-size:12px;color:#b9aa8d;word-break:break-all}.buttons{display:flex;gap:6px;justify-content:end}
button,a{border:1px solid var(--line);border-radius:7px;background:#201e1a;color:#ddd3bf;padding:8px 10px;text-decoration:none;cursor:pointer;font-size:11px}
button:hover,a:hover{border-color:#765b25;color:var(--accent)}
button.save{background:var(--accent);border-color:var(--accent);color:#171512;font-weight:900}
@media(max-width:800px){.row{grid-template-columns:34px 1fr}.id{grid-column:2}.buttons{grid-column:2;justify-content:start}.top{align-items:start;flex-direction:column}}
</style>
</head>

const state = structuredClone(SONGS);
const search = document.getElementById("search");
const list = document.getElementById("list");
const stat = document.getElementById("stat");
const bar = document.getElementById("bar");

function render(){
  const q=search.value.trim().toLowerCase();
  list.innerHTML="";
  state.forEach((s,i)=>{
    if(q && !(`${s.title} ${s.artist}`.toLowerCase().includes(q))) return;
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`
      <span class="num">${String(i+1).padStart(2,"0")}</span>
      <span><span class="title">${esc(s.title)}</span><span class="artist">${esc(s.artist)}</span></span>
      <input class="id" value="${esc(s.youtubeId||"")}" placeholder="YouTube video ID">
      <span class="buttons">
        <a target="_blank" rel="noopener" href="${ytSearch(s)}">Search</a>
        <button class="save">Use ID</button>
      </span>`;
    const input=row.querySelector("input");
    row.querySelector(".save").onclick=()=>{
      state[i].youtubeId=normalize(input.value);
      input.value=state[i].youtubeId;
      updateStats();
    };
    list.appendChild(row);
  });
  updateStats();
}
function normalize(v){
  v=v.trim();
  const m=v.match(/(?:v=|youtu\\.be\\/|embed\\/)([A-Za-z0-9_-]{6,})/);
  return m?m[1]:v.replace(/[^A-Za-z0-9_-]/g,"");
}
function ytSearch(s){return "https://www.youtube.com/results?search_query="+encodeURIComponent(`${s.title} ${s.artist} official`)}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function updateStats(){
  const ready=state.filter(s=>s.youtubeId).length;
  stat.textContent=`${ready} / ${state.length} READY`;
  bar.style.width=`${state.length ? ready/state.length*100 : 0}%`;
}
search.addEventListener("input",render);
render();
</script></body></html>
